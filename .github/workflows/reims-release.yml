name: Reims vGPU packages

# Builds Reims vGPU's QEMU, reims-ctl and reims-util at the commit reims/Dockerfile pins, for each Ubuntu
# release the app supports, for Debian 13 (Dockerfile with BASE=debian:13) and Rocky Linux 10
# (Dockerfile.rocky), and publishes the packages
# `kvm-gui reims install` downloads (Ubuntu only), with their corresponding source, on a
# release of their own. Tag: reims-<7-digit commit>.
# After a release, reims/manifest.json takes the published SHA-256 files.
# reims-upstream.yml calls it with another upstream commit (its `commit` input): the Dockerfiles are
# then pinned to that commit for the build only, and the release is tagged at the calling commit.

on:
  push:
    tags:
      - 'reims-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]'
  workflow_call:
    inputs:
      commit:
        description: upstream commit (40 hex digits) to build instead of the pinned one
        type: string
        required: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      matrix:
        include:
          - { release: '26.04', image: 'ubuntu:26.04', dockerfile: Dockerfile, arg: 'UBUNTU=26.04' }
          - { release: debian13, image: 'debian:13', dockerfile: Dockerfile, arg: 'BASE=debian:13' }
          - { release: rocky10, image: 'rockylinux/rockylinux:10', dockerfile: Dockerfile.rocky, arg: 'ROCKY=10' }

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check the tag against the pinned commit, or pin the requested one
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          if [ -n "$COMMIT" ]; then
            echo "$COMMIT" | grep -Eqx '[0-9a-f]{40}' || { echo "commit must be 40 hex digits"; exit 1; }
            sed -i "s/^ARG REIMS_COMMIT=.*/ARG REIMS_COMMIT=$COMMIT/" reims/Dockerfile reims/Dockerfile.rocky
            grep -H '^ARG REIMS_COMMIT=' reims/Dockerfile reims/Dockerfile.rocky
          else
            commit="$(sed -n 's/^ARG REIMS_COMMIT=\([0-9a-f]\{7\}\).*/\1/p' reims/Dockerfile)"
            test "$GITHUB_REF_NAME" = "reims-$commit" || { echo "the tag must be reims-$commit"; exit 1; }
          fi

      # The image (about 4.5 GB) and the build (about 3 GB) do not fit the runner's free space.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Build image
        run: docker build --progress=plain --build-arg ${{ matrix.arg }} -t reims-build:${{ matrix.release }} - < reims/${{ matrix.dockerfile }}

      - name: Build QEMU
        run: |
          mkdir -p work
          docker run --rm -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" -v "$PWD/work:/build" reims-build:${{ matrix.release }}

      - name: Package
        run: reims/package.sh pkg "$(readlink -f work/share/reims-ctl/qemu/current)" ${{ matrix.release }} dist

      - name: Check the package in a clean ${{ matrix.image }}
        run: |
          mkdir check
          tar -xzf dist/*.tar.gz -C check
          docker run --rm -v "$PWD/check:/q:ro" ${{ matrix.image }} bash -euo pipefail -c '
            if command -v apt-get >/dev/null; then
              apt-get update -qq && apt-get install -y -qq --no-install-recommends libglib2.0-0t64 libpixman-1-0 \
                libslirp0 libfdt1 libgtk-3-0t64 libpipewire-0.3-0t64 libpulse0 libasound2t64 libvulkan1 libgbm1 libusb-1.0-0 >/dev/null
            else
              dnf -y -q install glib2 pixman libslirp libfdt gtk3 pipewire-libs pulseaudio-libs alsa-lib \
                vulkan-loader mesa-libgbm libusb1 >/dev/null
            fi
            /q/bin/qemu-system-x86_64 -device help | grep -F "\"apple-gfx-pci\""
            /q/bin/reims-ctl --version && /q/bin/reims-util --version'

      - name: Source archive
        if: matrix.release == '26.04'
        run: |
          reims/package.sh src reims-build:${{ matrix.release }} dist
          # The packages' corresponding source must be in the release: fail here rather than ship without it.
          ls dist/reims-vgpu-src-*.tar.gz dist/reims-vgpu-src-*.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: reims-${{ matrix.release }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Version from the tag or the requested commit
        id: v
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          if [ -n "$COMMIT" ]; then v="${COMMIT:0:7}"; else v="${GITHUB_REF_NAME#reims-}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Reims vGPU QEMU ${{ steps.v.outputs.version }}
          tag_name: reims-${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: false # the app's own releases stay "latest"
          body: |
            Reims vGPU's QEMU (https://github.com/steelbrain/reims-vgpu) built for Ubuntu 26.04, Debian 13 and Rocky Linux 10, which `kvm-gui reims install` downloads when reims/manifest.json pins this commit (Ubuntu 24.04 packages: release reims-1fe0acb, for kvm-gui v0.15.0). Upstream commit: https://github.com/steelbrain/reims-vgpu/commit/${{ inputs.commit || steps.v.outputs.version }}. The source archive is the corresponding source of these binaries (GPL-2.0); see THIRD_PARTY_NOTICES.md.
          files: |
            dist/*.tar.gz
            dist/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
