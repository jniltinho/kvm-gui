name: kvm-gui release

# Manual: gh workflow run go-release.yml --ref vX.Y.Z publishes the release; with -f publish=false
# (on any ref) it builds and uploads the five files as workflow artifacts and publishes nothing.
# The release job needs ci.yml green on this exact commit: it runs it first, then publishes the
# very files CI built and checked (its dist artifact), never a rebuild.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the GitHub release (false keeps the files as workflow artifacts)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Refuse to publish from anything but a v* tag
        if: inputs.publish
        run: |
          case "$GITHUB_REF" in refs/tags/v*) ;; *) echo "publish needs a v* tag (got $GITHUB_REF); use publish=false to try a build"; exit 1;; esac

      # The files CI built and checked on the four distributions, byte for byte: no rebuild.
      - name: The artifacts CI checked
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Verify them
        run: |
          cd dist && sha256sum -c SHA256SUMS
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ls kvm-gui-"$GITHUB_REF_NAME"-linux-amd64 || { echo "CI built another version than $GITHUB_REF_NAME"; exit 1; }
          fi

      - name: Keep the files (publish=false)
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: kvm-gui-release
          path: |
            dist/kvm-gui-*-x86_64.AppImage
            dist/kvm-gui-v*-linux-amd64
            dist/kvm-gui_*.deb
            dist/kvm-gui-*.rpm
            dist/SHA256SUMS

      - name: Create Release
        if: inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          name: kvm-gui ${{ github.ref_name }}
          make_latest: true
          generate_release_notes: true
          files: |
            dist/kvm-gui-*-x86_64.AppImage
            dist/kvm-gui-v*-linux-amd64
            dist/kvm-gui_*.deb
            dist/kvm-gui-*.rpm
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
