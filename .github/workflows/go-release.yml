name: kvm-gui release

# Manual: gh workflow run go-release.yml --ref vX.Y.Z publishes the release; with -f publish=false
# (on any ref) it builds and uploads the five files as workflow artifacts and publishes nothing.
# The release job needs ci.yml green on this exact commit: it runs it first.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the GitHub release (false keeps the files as workflow artifacts)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Refuse to publish from anything but a v* tag
        if: inputs.publish
        run: |
          case "$GITHUB_REF" in refs/tags/v*) ;; *) echo "publish needs a v* tag (got $GITHUB_REF); use publish=false to try a build"; exit 1;; esac

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and Package
        run: | # a tag names the version; another ref gets git describe's (no slash in file names)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then make dist VERSION="$GITHUB_REF_NAME"; else make dist; fi

      - name: Keep the files (publish=false)
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: kvm-gui-release
          path: |
            dist/kvm-gui-*-x86_64.AppImage
            dist/kvm-gui-v*-linux-amd64
            dist/kvm-gui_*.deb
            dist/kvm-gui-*.rpm
            dist/SHA256SUMS

      - name: Create Release
        if: inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          name: kvm-gui ${{ github.ref_name }}
          make_latest: true
          generate_release_notes: true
          files: |
            dist/kvm-gui-*-x86_64.AppImage
            dist/kvm-gui-v*-linux-amd64
            dist/kvm-gui_*.deb
            dist/kvm-gui-*.rpm
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
