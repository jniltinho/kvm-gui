name: kvm-gui release

# Manual: run it on a v* tag (gh workflow run go-release.yml --ref vX.Y.Z). Everything builds in the
# build image through make. Until the Wails GUI lands, a commit without frontend/package.json is
# refused, so no CLI-only build is ever released.
on:
  workflow_dispatch:

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse a release without the desktop GUI
        run: test -f frontend/package.json || { echo "no frontend/package.json: the Wails GUI is not in this commit"; exit 1; }

      - name: Test
        run: make test openspec

      - name: Build and Package
        run: make dist VERSION=${GITHUB_REF_NAME}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: kvm-gui ${{ github.ref_name }}
          make_latest: true
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
