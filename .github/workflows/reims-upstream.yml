name: Reims vGPU packages from upstream

# Builds and publishes the Reims vGPU packages (reims-release.yml) at the newest commit of
# steelbrain/reims-vgpu's default branch (master), as release reims-<7-digit commit>, unless that release exists.
# The app keeps installing the commit reims/manifest.json pins: to move it, pin reims/Dockerfile,
# reims/Dockerfile.rocky and the manifest to the new release (docs/reims-vgpu.md). Keep the
# manifest's release when deleting old ones (AGENTS.md: the last 2 of each series).

on:
  workflow_dispatch:
    inputs:
      force:
        description: build even when the release already exists (it is then updated)
        type: boolean
        default: false
      publish:
        description: publish the release (false keeps the packages as this run's artifacts and touches no release)
        type: boolean
        default: true

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.head.outputs.commit }}
      build: ${{ steps.head.outputs.build }}
    steps:
      - name: Newest upstream commit
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          commit="$(git ls-remote https://github.com/steelbrain/reims-vgpu HEAD | cut -f1)" # the default branch, master
          echo "$commit" | grep -Eqx '[0-9a-f]{40}' || { echo "no upstream HEAD: '$commit'"; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if gh release view "reims-${commit:0:7}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [ "$FORCE" != true ] && [ "$PUBLISH" != false ]; then
            echo "reims-${commit:0:7} is already released" >> "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building upstream $commit as reims-${commit:0:7}" >> "$GITHUB_STEP_SUMMARY"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  packages:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/reims-release.yml
    with:
      commit: ${{ needs.resolve.outputs.commit }}
      publish: ${{ inputs.publish }}
